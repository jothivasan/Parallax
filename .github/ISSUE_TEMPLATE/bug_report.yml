name: Bug Report
description: Report an unexpected execution trace, visualizer glitch, or runtime crash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Parallax! Please provide reproducible steps.
  - type: dropdown
    id: language
    attributes:
      label: Programming Language
      description: Which language runtime is affected?
      options:
        - JavaScript (ES2024)
        - TypeScript (5.4)
        - Python (3.13)
        - C (C17)
        - C++ (C++20)
        - Java (21 LTS)
        - C# (.NET 8)
    validations:
      required: true
  - type: dropdown
    id: execution_mode
    attributes:
      label: Execution Mode
      description: Which execution mode was selected?
      options:
        - Browser Mode (Web Worker / WASM)
        - Native Mode (Local Server / Host Compilers)
        - Auto Mode
    validations:
      required: true
  - type: textarea
    id: source_code
    attributes:
      label: Minimal Reproducible Code Snippet
      description: The exact user code that triggered the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What trace steps, variables, or visualizer output did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What trace steps or errors actually occurred?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS Environment
      description: e.g. Chrome 124 on macOS, Firefox 125 on Ubuntu 22.04
    validations:
      required: false
